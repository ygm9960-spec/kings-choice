<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09111d">
<title>왕의 선택 · 학습지형 시뮬레이션 v0.13</title>
<style>
:root{
  --bg:#060b12;--panel:#101a28;--panel2:#162438;--line:#2c3a4e;
  --gold:#d9bb70;--gold2:#ffe7a7;--text:#fbf8f0;--muted:#c8d1dd;
  --red:#9f3c3e;--paper:#f1e7d0;--ink:#2e271e;--ok:#88b494;
  --soft-red:#f5dddd;--soft-red-line:#d98d96;--deep-red:#a62031;
  --soft-blue:#dceaf8;--soft-blue-line:#8fb5dd;--deep-blue:#155b9c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 50% -10%,rgba(75,100,132,.25),transparent 42%),
  linear-gradient(180deg,#0d1725 0,#070e18 56%,#04080e 100%);
  color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;cursor:pointer}
.shell{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:10px;
 padding:8px 14px;background:rgba(5,9,15,.9);backdrop-filter:blur(12px);
 border-bottom:1px solid rgba(210,179,107,.14)}
.brand{font-family:"Noto Serif KR",serif;font-weight:800;letter-spacing:.12em;color:var(--gold2)}
.spacer{flex:1}
.ghost-btn{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#b8c1ce;
 border-radius:999px;padding:7px 10px;font-size:12px}
.progress{height:2px;background:#111b29} .progress>div{height:100%;width:0;background:linear-gradient(90deg,#8f3033,#d2b36b,#f3dfab);transition:.25s}
main{width:min(680px,100%);margin:auto;padding:18px 16px 112px}
.hero{padding:12px 2px 16px}.eyebrow{font-size:12px;letter-spacing:.15em;color:#f0cd78;font-weight:900}
.hero h1{font-family:"Noto Serif KR","Nanum Myeongjo","Batang",serif;font-size:32px;line-height:1.3;margin:8px 0 10px;word-break:keep-all;letter-spacing:-.02em}
.hero p{color:#d5dde8;font-size:15.5px;font-weight:650;line-height:1.75;margin:0;word-break:keep-all}
.card{background:linear-gradient(180deg,rgba(25,42,64,.99),rgba(13,24,38,.99));
 border:1px solid rgba(223,198,132,.24);border-radius:22px;padding:20px;box-shadow:0 18px 45px rgba(0,0,0,.30)}
.card+.card{margin-top:12px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;color:#c8d0db;margin-bottom:10px}
.quote{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:18px;font-weight:650;line-height:1.85;word-break:keep-all}
.small{font-size:14px;line-height:1.7;color:#cbd4df}.gold{color:var(--gold2)}
.notice{padding:16px;border-radius:16px;border:1px solid #967b3f;background:#292313;color:#fff0bf;font-size:15px;font-weight:700;line-height:1.75}
.choices{display:grid;gap:10px}
.choice{position:relative;width:100%;text-align:left;border:1px solid #41516a;border-radius:16px;background:#0d1928;color:var(--text);padding:16px 18px;min-height:74px}
.choice:hover{border-color:#6e5e3b} .choice.selected{border-color:var(--gold);background:linear-gradient(180deg,#1c2a3c,#122033)}
.choice strong{display:block;font-size:17px;font-weight:900;margin-bottom:6px;color:#fff8e8}.choice span{font-size:14px;line-height:1.6;color:#d1dae6}
.choice::before{content:attr(data-key);position:absolute;right:13px;top:12px;width:23px;height:23px;border:1px solid rgba(210,179,107,.2);border-radius:50%;
display:grid;place-items:center;font-size:10px;color:#95866a}
.sheet-check{background:linear-gradient(180deg,#efe5cc,#ddcda8);color:var(--ink);border:0}
.sheet-check h2{font-family:"Noto Serif KR",serif;margin:.2em 0 .6em} .sheet-check .step{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.sheet-check .num{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#7b2d30;color:white;font-weight:800;font-size:12px}
.sheet-check .step b{display:block;margin-bottom:3px} .sheet-check .step div{line-height:1.55}
.perspectives{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.perspective{border:1px solid #46566d;background:#0d1928;color:#fffaf0;border-radius:14px;padding:14px 8px;text-align:center;min-height:82px;font-weight:800}
.perspective.selected{border:2px solid #f1ce76;background:#26384e;box-shadow:0 0 0 2px rgba(241,206,118,.12) inset}.perspective.disabled{opacity:.25;cursor:not-allowed}
.perspective b{display:block;font-size:16px;margin:0}
.result{position:relative;overflow:hidden;padding:24px;border:1px solid #d9ae61;border-radius:24px;background:
 linear-gradient(145deg,rgba(126,48,47,.96),rgba(62,31,54,.98) 48%,rgba(25,31,49,.98));
 box-shadow:0 22px 58px rgba(0,0,0,.38),0 0 0 1px rgba(240,219,159,.08) inset}
.result::before{content:"";position:absolute;inset:-60% 35% auto -20%;height:240px;background:radial-gradient(circle,rgba(255,225,158,.18),transparent 65%);pointer-events:none}
.result .badge{border-color:rgba(255,230,174,.42);color:#ffe7ad;background:rgba(43,14,19,.35)}
.result .result-title{position:relative;font-family:"Noto Serif KR",serif;font-size:24px;font-weight:900;color:#ffe2a1;margin:2px 0 12px;word-break:keep-all}
.result .copy{position:relative;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:20px;font-weight:750;line-height:1.78;word-break:keep-all;color:#fff8ed}
.simulation-box{padding:26px 22px;border:1px solid rgba(210,179,107,.24);border-radius:24px;background:linear-gradient(180deg,#111d2c,#0b1420);box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
.simulation-box .sim-title{font-family:"Noto Serif KR",serif;font-size:22px;font-weight:900;color:#f2dfac;margin:4px 0 8px}
.simulation-box .sim-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px}
.sim-track{height:16px;border-radius:999px;overflow:hidden;background:#050a10;border:1px solid #334158;box-shadow:inset 0 2px 8px rgba(0,0,0,.65)}
.sim-fill{height:100%;width:0;background:linear-gradient(90deg,#7f3036,#d1a756 55%,#f0d994);box-shadow:0 0 18px rgba(224,184,91,.45)}
.sim-percent{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:10px;color:#f3dfab;font-weight:800;font-size:13px}
.actual{padding:22px;border:1px solid #435e7e;border-radius:22px;background:linear-gradient(180deg,#13223a,#0e192b)}
.actual .copy{font-size:15px;line-height:1.8;color:#e5ebf4;word-break:keep-all}
.summary{display:grid;gap:10px} .summary-item{padding:14px;border:1px solid var(--line);border-radius:15px;background:#0d1826}
.summary-item b{display:block;color:var(--gold2);font-size:12px;margin-bottom:6px} .summary-item div{line-height:1.55}
.explorer-controls{display:grid;gap:10px} select{width:100%;border:1px solid var(--line);border-radius:13px;background:#0a1420;color:white;padding:12px}
.explorer-result{margin-top:12px;padding:16px;border-radius:15px;background:#17152a;border:1px solid #56466e;line-height:1.7}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:25px 16px max(14px,env(safe-area-inset-bottom));
background:linear-gradient(180deg,rgba(4,8,14,0),rgba(4,8,14,.94) 35%,#04080e)}
.actions-inner{width:min(680px,100%);margin:auto;display:flex;gap:9px}
.btn{flex:1;border:1px solid #46566d;border-radius:15px;padding:15px 17px;min-height:52px;font-size:15px;font-weight:900;background:#17283d;color:#fffaf0}
.btn.primary{background:linear-gradient(180deg,#dfc47f,#b8954d);color:#1d160b;border-color:#e7cf91} .btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:#0b1420;color:#e0e7ef;border-color:#526177}
.intro-seal{width:74px;height:74px;border-radius:50%;border:1px solid rgba(210,179,107,.32);display:grid;place-items:center;margin:24px auto 14px;
font-family:"Noto Serif KR",serif;font-size:28px;color:var(--gold2);background:radial-gradient(circle,rgba(210,179,107,.12),transparent 70%)}
.scene{min-height:440px;border-radius:24px;overflow:hidden;position:relative;background:
linear-gradient(180deg,rgba(5,9,15,.08) 0,rgba(5,9,15,.35) 45%,rgba(3,6,10,.92) 100%),url("assets/palace.svg") center/cover;
border:1px solid rgba(210,179,107,.15);box-shadow:0 20px 50px rgba(0,0,0,.32)}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,rgba(238,198,117,.11),transparent 34%);
pointer-events:none}
.scene-inner{position:relative;z-index:2;min-height:440px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}
.scene .meta{position:absolute;top:17px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:11px;color:#c8b98f}
.dialogue{background:linear-gradient(180deg,rgba(5,9,15,.9),rgba(4,8,14,.97));border:1px solid rgba(210,179,107,.18);border-radius:18px;padding:17px;backdrop-filter:blur(5px)}
 .dialogue .title{color:var(--gold2);font-size:12px;font-weight:800;margin-bottom:7px} .dialogue .quote{font-size:17px}
.debate-stack{display:grid;gap:12px}
.argument-card{border:1px solid transparent;border-radius:20px;padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.2)}
.argument-card.tone-conservative{background:linear-gradient(180deg,#e7f1fb,#d5e6f6);border-color:var(--soft-blue-line);color:#142b42}
.argument-card.tone-radical{background:linear-gradient(180deg,#f9e7e7,#f2d5d8);border-color:var(--soft-red-line);color:#482026}
.argument-card .position{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:11px;letter-spacing:.08em;font-weight:900}
.argument-card.tone-conservative .position{color:#336eaa}.argument-card.tone-radical .position{color:#ae4050}
.argument-card .speaker{font-family:"Noto Serif KR",serif;font-size:18px;font-weight:900;margin-bottom:8px;color:inherit}
.argument-card .argument-copy{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:16px;font-weight:650;line-height:1.8;word-break:keep-all;color:inherit}
.argument-card.tone-conservative .emph{color:var(--deep-blue);font-weight:950;text-decoration:underline;text-decoration-color:rgba(21,91,156,.25);text-underline-offset:3px}
.argument-card.tone-radical .emph{color:var(--deep-red);font-weight:950;text-decoration:underline;text-decoration-color:rgba(166,32,49,.23);text-underline-offset:3px}
.debate-stack.compact{gap:8px;margin-bottom:12px}
.debate-stack.compact .argument-card{padding:13px 14px;border-radius:15px}
.debate-stack.compact .argument-card .position{margin-bottom:5px;font-size:10px}
.debate-stack.compact .argument-card .speaker{font-size:14px;margin-bottom:5px}
.debate-stack.compact .argument-card .argument-copy{font-size:13px;line-height:1.62}
.debate-guide{margin-bottom:12px;color:#f4e5b8;font-size:14px;font-weight:750;line-height:1.65;padding:11px 13px;border-radius:12px;background:#241f14;border:1px solid #6d5b32}
@media(max-width:520px){
 main{padding-top:12px}.hero h1{font-size:29px}.perspectives{grid-template-columns:repeat(2,1fr)}.scene,.scene-inner{min-height:420px}
 .result .copy{font-size:18px}
}

.instruction-box{position:relative;margin:0 0 14px;padding:16px 17px 16px 18px;border:2px solid #d6b45f;border-radius:16px;background:linear-gradient(135deg,#342b16,#211c10);color:#fff7d8;box-shadow:0 10px 28px rgba(0,0,0,.24),0 0 0 1px rgba(255,230,156,.06) inset;font-size:16px;font-weight:800;line-height:1.75;word-break:keep-all}
.instruction-box::before{content:"지금 할 일";display:block;width:max-content;margin-bottom:7px;padding:3px 8px;border-radius:999px;background:#e2bf67;color:#211809;font-size:11px;font-weight:950;letter-spacing:.08em}
.instruction-box strong,.instruction-box b{color:#ffe394;font-weight:950}
.instruction-box.blue{border-color:#75a9db;background:linear-gradient(135deg,#142b42,#102033);color:#eef7ff}.instruction-box.blue::before{background:#8fc0ed;color:#0b2135}.instruction-box.blue strong{color:#bfe1ff}
.section-label{font-size:13px;font-weight:900;color:#f0cd78;letter-spacing:.04em;margin:0 0 8px}
.sheet-check .step{font-size:15px}.sheet-check .step b{font-size:16px}.sheet-check .step div{line-height:1.7}
.result{border-width:2px}.result .result-title{font-size:26px}.result .copy{font-size:20px;font-weight:750}
.actual .copy{font-size:16px;line-height:1.85}

.stage-strip{display:flex;gap:6px;overflow-x:auto;padding:9px 12px 8px;background:rgba(7,13,22,.96);border-bottom:1px solid rgba(255,255,255,.06);scrollbar-width:none}
.stage-strip::-webkit-scrollbar{display:none}.stage-chip{flex:0 0 auto;border:1px solid #35445a;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;color:#8f9cad;background:#0b1522;white-space:nowrap}
.stage-chip.done{color:#cbd5e2;border-color:#526177;background:#142033}.stage-chip.current{color:#251a08;border-color:#e6c873;background:linear-gradient(180deg,#f6dea0,#d2ad57);box-shadow:0 0 0 2px rgba(230,200,115,.12)}
.decision-gate{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 18px}.decision-gate .seal-text{width:78px;height:78px;border:2px solid #cda94f;border-radius:50%;display:grid;place-items:center;color:#f0d891;font-family:"Noto Serif KR",serif;font-size:28px;font-weight:900;margin-bottom:20px;animation:gatePulse 1.6s ease-in-out infinite}.decision-gate h1{font-family:"Noto Serif KR",serif;font-size:31px;line-height:1.35;margin:0 0 12px;color:#fff2c9}.decision-gate p{max-width:460px;margin:0;color:#ccd5e1;font-weight:650;line-height:1.8}.decision-gate .gate-line{width:90px;height:1px;background:linear-gradient(90deg,transparent,#d8b866,transparent);margin:22px 0}
@keyframes gatePulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(219,187,104,.12)}50%{transform:scale(1.045);box-shadow:0 0 0 12px rgba(219,187,104,0)}}
.decision-banner{position:sticky;top:62px;z-index:12;margin:0 0 12px;padding:11px 13px;border:1px solid #8b7138;border-radius:14px;background:linear-gradient(180deg,rgba(49,41,22,.98),rgba(30,26,16,.98));box-shadow:0 8px 24px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
.decision-banner .decision-kicker{font-size:10px;font-weight:950;letter-spacing:.12em;color:#e4c770;margin-bottom:4px}.decision-banner .decision-main{font-size:14px;font-weight:900;color:#fff4cf;line-height:1.55;word-break:keep-all}.decision-banner .decision-sub{font-size:12px;color:#d7cda9;margin-top:3px;line-height:1.5}
.perspective{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.perspective .p-status{font-size:10px;font-weight:900;color:#8fa0b5}.perspective.selected .p-status{color:#f1ce76}.perspective.disabled{opacity:.62;background:#0a111b;border-style:dashed}.perspective.disabled b{color:#8794a4}.perspective.disabled .p-status{color:#697789}
.result.result-reveal{animation:resultIn .55s cubic-bezier(.2,.8,.2,1) both}.result-stamp{position:absolute;right:16px;top:14px;border:1px solid rgba(255,232,175,.48);border-radius:8px;padding:5px 8px;font-size:10px;font-weight:950;letter-spacing:.08em;color:#ffe6a9;background:rgba(37,13,18,.42);transform:rotate(2deg)}
@keyframes resultIn{0%{opacity:0;transform:translateY(14px) scale(.985);filter:blur(3px)}100%{opacity:1;transform:none;filter:none}}
.summary{counter-reset:decision}.summary-item{position:relative;padding-left:48px}.summary-item::before{counter-increment:decision;content:counter(decision);position:absolute;left:14px;top:14px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#d5b969;color:#241907;font-weight:950;font-size:12px;box-shadow:0 0 0 3px rgba(213,185,105,.1)}
.summary-item .summary-result{margin-top:8px;padding:9px 10px;border-left:3px solid #7962a0;background:#141427;border-radius:0 10px 10px 0;color:#e2d8f2;font-size:13px;line-height:1.65}

@media (max-width:520px){.hero h1{font-size:29px}.instruction-box{font-size:15.5px}.argument-card .argument-copy{font-size:15.5px}.result .copy{font-size:18px}.actions{padding-left:12px;padding-right:12px}.btn{font-size:14.5px}}

/* v0.13 · interaction polish */
body{font-size:16.5px}
.hero h1{font-weight:900;letter-spacing:-.035em}.hero p{line-height:1.82}
.card,.argument-card,.choice,.result,.actual,.instruction-box,.decision-banner{transition:border-color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease}
.choice{overflow:hidden;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease}
.choice:active{transform:scale(.992)}
.choice.selected{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.24),0 0 0 2px rgba(217,187,112,.12) inset}
.choice.selected::after{content:"선택됨";position:absolute;right:44px;top:12px;padding:3px 7px;border-radius:999px;background:#dcc071;color:#201708;font-size:9px;font-weight:950;letter-spacing:.05em}
.btn{transition:transform .14s ease,filter .14s ease,box-shadow .14s ease}.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}.btn.primary:not(:disabled){box-shadow:0 8px 22px rgba(184,149,77,.2)}
.screen-enter{animation:screenEnter .34s cubic-bezier(.2,.75,.25,1) both}
@keyframes screenEnter{from{opacity:0;transform:translateY(8px);filter:blur(1.5px)}to{opacity:1;transform:none;filter:none}}
.decision-banner{border-left:4px solid #d6b45f;padding-left:12px}
.dialogue .quote{line-height:1.9;font-weight:650}
.argument-card .argument-copy{letter-spacing:-.01em}
.instruction-box{box-shadow:0 12px 32px rgba(0,0,0,.27),0 0 0 1px rgba(255,230,156,.08) inset}
.result-balance{position:relative;display:grid;gap:10px;margin-top:4px}
.result-side{position:relative;padding:15px 15px 15px 16px;border-radius:15px;border:1px solid rgba(255,255,255,.12);font-size:17px;font-weight:760;line-height:1.75;word-break:keep-all}
.result-side .result-side-label{display:block;margin-bottom:6px;font-size:10px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
.result-side.gain{background:linear-gradient(135deg,rgba(224,190,105,.18),rgba(65,54,31,.32));border-color:rgba(239,210,136,.32);color:#fff6dc}
.result-side.gain .result-side-label{color:#f4d98d}
.result-side.risk{background:linear-gradient(135deg,rgba(153,54,65,.25),rgba(54,25,34,.38));border-color:rgba(218,119,132,.34);color:#fff0f1}
.result-side.risk .result-side-label{color:#f0a7b0}
.result-connector{display:flex;align-items:center;gap:9px;color:#ddcda3;font-size:11px;font-weight:950;letter-spacing:.08em}
.result-connector::before,.result-connector::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(226,202,141,.45),transparent)}
.confirm-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(1,4,8,.68);backdrop-filter:blur(6px);animation:overlayIn .18s ease both}
.confirm-sheet{width:min(620px,100%);border:1px solid rgba(230,200,115,.34);border-radius:24px;background:linear-gradient(180deg,#17263a,#0b1522);box-shadow:0 28px 80px rgba(0,0,0,.55);padding:20px;animation:sheetUp .25s cubic-bezier(.2,.8,.2,1) both}
.confirm-kicker{font-size:11px;font-weight:950;letter-spacing:.12em;color:#dfc574}.confirm-sheet h2{font-family:"Noto Serif KR",serif;font-size:23px;line-height:1.4;margin:8px 0;color:#fff2ca}.confirm-choice{padding:13px 14px;border-radius:14px;background:#0a1420;border-left:4px solid #d5b65f;color:#fff6d9;font-weight:900;line-height:1.65;margin:12px 0 16px}.confirm-actions{display:flex;gap:8px}.confirm-actions .btn{position:static}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}@keyframes sheetUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.simulation-box.complete .sim-title{color:#fff2c7}.simulation-box.complete .sim-track{box-shadow:0 0 0 1px rgba(240,217,148,.12),0 0 30px rgba(224,184,91,.18)}
.simulation-box.complete .sim-fill{filter:brightness(1.14)}
.summary-item .summary-title{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:900;color:#f2dfac;margin-top:7px}
.summary-perspectives{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.summary-perspectives span{border:1px solid #40516a;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;color:#cbd5e2;background:#0c1724}
@media(max-width:520px){.result-side{font-size:16px}.confirm-sheet{padding:18px}.confirm-sheet h2{font-size:21px}}

</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand">왕의 선택</div><div class="spacer"></div>
  <button class="ghost-btn" onclick="restart()">처음부터</button>

<script>
const STORY = {"perspectives": {"people": {"label": "백성"}, "soldier": {"label": "군인"}, "yangban": {"label": "신하(양반)"}, "ming": {"label": "명"}, "laterjin": {"label": "후금(청)"}, "nobi": {"label": "노비"}}, "chapters": [{"id": "D1", "year": "1618~1619", "king": "광해군", "title": "명의 파병 요청", "subtitle": "임진왜란의 은혜인가, 조선의 생존인가", "contextCards": [{"badge": "실제 역사 · 선택 전", "title": "명의 요청", "body": "임진왜란이 끝난 지 오래되지 않은 조선에 명나라가 후금과의 전쟁을 위한 원군을 요청했습니다. 조선은 전쟁의 피해를 복구하는 중이었고, 북쪽에서는 후금이 빠르게 성장하고 있었습니다."}, {"badge": "교육용 재구성 대사", "title": "서인의 주장", "body": "전하! 임진왜란 때 명은 우리 조선을 구하기 위해 8만 명이 넘는 병력 손실을 감수하고, 조선의 몇 년 치 세금에 맞먹는 은 천만 냥을 전쟁에 쏟아부었습니다! 그토록 큰 희생으로 우리를 지켜 준 명이 이제 위기에 빠졌습니다. 전하! 이제 와서 그 은혜를 저버리고 명을 외면하시겠습니까?!"}, {"badge": "교육용 재구성 대사", "title": "북인의 주장", "body": "명의 은혜를 모르는 것이 아닙니다! 그러나 임진왜란으로 무너진 들판은 아직 일어서지 못했습니다. 명을 돕다가 후금까지 적으로 돌려 다시 전쟁이 일어난다면, 조선의 백성은 누가 지킵니까? 전하, 은혜를 갚으려다 우리 나라를 또 잃을 수는 없습니다!"}, {"badge": "왕의 생각 · 재구성", "title": "은혜와 생존", "body": "명의 희생을 외면할 수 없다. 그러나 조선이 또다시 전쟁을 겪게 할 수도 없다. 은혜와 생존을 모두 지킬 길은 없는가?"}], "policies": [{"id": "P1", "title": "전면 파병", "desc": "명의 원정에 적극적으로 참여한다."}, {"id": "P2", "title": "제한적 파병", "desc": "파견 인원을 줄여 일부만 보낸다."}, {"id": "P3", "title": "조건부 파병", "desc": "군사 운영과 보급 조건을 먼저 협의한다."}, {"id": "P4", "title": "국경 방어 중심 지원", "desc": "국경에 병력을 배치하며 현지 지원을 제안한다."}, {"id": "P5", "title": "군수 물자 지원", "desc": "군사 대신 식량·물자를 지원하겠다고 제안한다."}, {"id": "P6", "title": "결정 연기·협상", "desc": "준비 시간을 요청하고 파병 조건을 다시 논의한다."}, {"id": "P7", "title": "파병 거절", "desc": "원정군 파견을 거절하고 조선의 방어에 집중한다."}], "responses": [{"id": "R1", "title": "명에 사유 설명", "desc": "명에 조선의 선택 이유와 요구 사항을 정식으로 전달한다."}, {"id": "R2", "title": "후금에 의도 설명", "desc": "후금에 조선의 입장과 군사 행동의 범위를 설명한다."}, {"id": "R3", "title": "양측에 설명", "desc": "명과 후금에 서로 다른 이해관계를 고려한 설명을 보낸다."}], "perspectiveQuotes": {"people": "명을 도운 은혜를 기억합니다. 그러나 또 군사가 떠나면 집의 일손과 살림은 누가 지킬까요?", "soldier": "명령을 받들겠습니다. 다만 길도 군량도 살펴야 동료들과 돌아올 수 있습니다.", "yangban": "지난 전쟁에 명이 보내 준 도움을 잊기 어렵습니다. 그렇다고 조선의 형편을 살피지 않을 수도 없습니다.", "ming": "우리가 요청하는 것은 함께 맞서는 협력입니다. 조선의 사정은 듣겠지만, 지금 도움이 필요합니다.", "laterjin": "조선군이 우리를 향해 오면 경계할 것입니다. 조선이 전하려는 사정이 있다면 들을 길은 남아 있습니까?", "nobi": "전쟁 준비로 실어야 할 짐이 늘면 제 몫의 일이 커집니다. 나라가 안전해야 저도 살아갈 수 있겠지요."}, "actualTitle": "1619년, 실제 역사는", "actual": "1618년 명의 원병 요청을 받은 광해군은 조선의 병력·농사 사정을 들어 파병 방식과 규모를 두고 논의했습니다. 결국 강홍립이 이끄는 조선군이 출병했고, 1619년 사르후 전투에서 명·조선 연합군은 후금에 패했습니다. 강홍립 등이 후금에 투항했으며 조선은 후금과의 교섭도 이어 갔습니다."}, {"id": "D2", "year": "1627", "king": "인조", "title": "정묘호란과 친명배금", "subtitle": "의리를 지킬 것인가, 전쟁을 끝낼 것인가", "contextCards": [{"badge": "실제 역사 · 선택 전", "title": "후금군이 국경을 넘다", "body": "1627년 후금군이 조선에 쳐들어왔습니다. 후금은 광해군을 폐위한 일을 침입의 구실로 내세웠지만, 명의 모문룡 부대를 견제하고 군량·물자를 확보하려는 목적도 있었습니다."}, {"badge": "교육용 재구성 대사", "title": "전령", "body": "전하! 후금이 폐위된 광해군의 원수를 갚겠다는 구실을 내세워 조선에 쳐들어왔습니다! 군대가 이미 국경을 넘었습니다!"}, {"badge": "교육용 재구성 대사", "title": "주화론을 주장하는 신하", "body": "전하! 명과의 의리를 지키는 동안 후금의 군대가 우리 땅으로 밀려오고 있습니다! 의리가 아무리 중요하다 한들, 지켜야 할 백성조차 사라진다면 그 의리는 누구를 위한 것입니까? 지금은 후금과 화친하여 나라와 백성을 지켜야 합니다!"}, {"badge": "교육용 재구성 대사", "title": "주전론을 주장하는 신하", "body": "전하! 우리는 지금껏 여진에게 무역소를 열어 식량을 교환해 주고, 토지와 관직까지 내어주며 달래고 회유해 왔습니다! 그런데도 그들의 약탈과 위협은 끊이지 않았습니다! 이제는 군사를 이끌고 쳐들어와 명과의 관계마저 끊으라 합니다! 오늘 하나를 내어주면 내일은 둘을 요구할 것입니다. 명을 버리고 나면, 그다음에는 무엇을 내놓으라 하겠습니까? 그들이 조선의 땅을 요구하고, 끝내 우리 백성들까지 내놓으라 한다면, 그때도 순순히 내어주시겠습니까?!"}], "policies": [{"id": "P1", "title": "친명배금 유지·항전", "desc": "명과의 의리를 지키고 후금을 물리치기 위한 항전을 이어 간다."}, {"id": "P2", "title": "명 중시·후금과 협상", "desc": "명과의 관계를 지키면서 후금과의 교섭으로 침입을 끝내려 한다."}, {"id": "P3", "title": "친명배금 기조 수정", "desc": "후금과의 관계 개선을 우선하고 명에 대한 지원을 줄이는 방안을 검토한다."}], "responses": [{"id": "R1", "title": "군사 방어", "desc": "국경과 주요 거점 방어, 군량 확보를 서두른다."}, {"id": "R2", "title": "사절·정보", "desc": "후금과 접촉할 사신을 보내고 침입 목적과 요구 조건을 파악한다."}, {"id": "R3", "title": "주민 보호", "desc": "피난과 식량 확보 등 전쟁에 휘말린 사람들의 안전을 우선한다."}], "perspectiveQuotes": {"people": "적군이 벌써 들어왔다고요? 명과의 의리도 중요하겠지만, 우리 가족이 피할 길부터 열어 주십시오.", "soldier": "전투에 나서는 명령을 따르겠습니다. 다만 군량과 방어 계획 없이 버티기만 해서는 안 됩니다.", "yangban": "반정 때 내세운 명과의 의리를 쉽게 거둘 수는 없습니다. 그러나 전쟁을 어떻게 끝낼지 또한 말해야 합니다.", "ming": "조선이 우리와의 관계를 지키리라 믿습니다. 후금과 어떤 조건으로 협상하는지 주목하고 있습니다.", "laterjin": "광해군을 몰아낸 조선 조정이 계속 명을 돕는다면 불안합니다. 우리도 조선에 원하는 것이 있습니다.", "nobi": "전쟁이 시작되면 피난 짐과 군량 운반이 제게 돌아옵니다. 나라의 명분은 제 목숨도 살펴 주는 것입니까?"}, "actualTitle": "1627년, 실제 정묘호란의 결말", "actual": "후금이 조선을 침입해 정묘호란이 일어났습니다. 인조는 강화도로 피난했고, 조선은 후금과 화의를 맺어 형제 관계를 설정했습니다. 후금은 광해군 폐위를 침입의 구실로 내세웠지만, 명의 모문룡 부대 견제와 물자 확보 등 복합적인 목적이 있었습니다."}, {"id": "D3", "year": "1636", "king": "인조", "title": "병자호란 직전의 선택", "subtitle": "왕관을 지키기 위해 무릎을 꿇을 것인가, 왕관을 걸고 맞설 것인가", "contextCards": [{"badge": "실제 역사 · 선택 전", "title": "형제에서 군신으로", "body": "정묘호란 뒤 조선과 후금은 형제 관계를 맺었습니다. 그러나 국호를 청으로 바꾼 후금은 이제 조선에 군신 관계를 요구합니다. 명을 섬겨 온 조선의 신하들은 크게 반발합니다."}, {"badge": "교육용 재구성 대사", "title": "주화론을 주장하는 신하", "body": "전하! 청의 군대는 강하고, 우리의 힘으로는 승리를 장담할 수 없습니다! 끝까지 싸우다 패한다면 전하께서는 왕위를 잃고, 조선의 왕조마저 무너질 수 있습니다! 살아남아야 다시 일어설 수 있습니다. 왕의 체면을 내려놓는 한이 있더라도, 지금은 무릎을 꿇고 훗날을 도모하소서! 전하! 자존심을 지키려다 왕위도, 나라도 모두 잃으시겠습니까?!"}, {"badge": "교육용 재구성 대사", "title": "주전론을 주장하는 신하", "body": "전하! 항복하면 왕위를 지킬 수 있다고 누가 장담하겠습니까?! 오늘 청의 신하가 되라는 요구를 받아들이면, 내일 그들이 전하의 왕관을 벗으라 할 때는 어찌하시겠습니까? 그들이 전하를 폐위하고 다른 왕을 세우겠다 한다면, 이미 항복한 조선에 무슨 힘으로 맞서겠습니까! 싸우지 않고 운명을 맡긴 왕에게, 자신의 왕위조차 결정할 권리가 남아 있겠습니까?! 그리고 오랑캐 앞에 무릎 꿇고 고개를 숙인 왕을, 과연 조선의 백성들이 예전처럼 따르겠습니까?!"}, {"badge": "왕의 생각 · 재구성", "title": "왕의 운명", "body": "항복하면 왕위를 지킬 수 있을까? 맞서 싸우면 왕관을 잃게 될까? 두 신하의 말이 끝났다. 이제 내 결정만 남았다."}], "policies": [{"id": "P1", "title": "주전론 · 청의 요구 거부", "desc": "명과의 의리를 지키며 청의 군신 관계 요구를 거부하고 전쟁에 대비한다."}, {"id": "P2", "title": "최후의 협상", "desc": "명과의 관계를 유지하려 하며 청에 요구 완화를 제안하고 결정을 미룬다."}, {"id": "P3", "title": "주화론 · 요구 수용(사실상 항복)", "desc": "청의 군신 관계 요구를 받아들여 전쟁을 피할 길을 모색한다."}], "responses": [{"id": "R1", "title": "방비", "desc": "군사 배치와 방어 시설을 우선 점검한다."}, {"id": "R2", "title": "긴급 협의", "desc": "청의 요구 사항을 다시 확인하고 조정·사신의 논의를 서두른다."}, {"id": "R3", "title": "주민 보호·식량", "desc": "피난 준비와 식량 확보를 우선한다."}], "perspectiveQuotes": {"people": "전쟁만은 피했으면 합니다. 하지만 청의 요구를 받아들이면 또 무엇을 내놓아야 할까요?", "soldier": "끝까지 싸우라는 명령도, 무기를 거두라는 명령도 무겁습니다. 무엇을 선택하든 준비가 필요합니다.", "yangban": "명을 섬기는 의리를 잊을 수 없습니다. 그렇다고 우리 군사와 백성의 형편을 묻지 않을 수도 없습니다.", "ming": "우리는 조선과 오랜 관계를 맺어 왔습니다. 청을 새로운 임금으로 섬기려 한다면 그 뜻을 어떻게 받아들여야 합니까?", "laterjin": "우리는 이제 청입니다. 조선이 새 군신 관계를 받아들일지 답을 기다리고 있습니다.", "nobi": "싸움이 나면 피난 짐과 식량을 짊어지는 사람도 있습니다. 항복하면 그 뒤의 부담은 누가 감당합니까?"}, "actualTitle": "1636~1637년, 실제 병자호란", "actual": "1636년 청은 조선에 군신 관계를 요구했고, 조선은 이를 거부했습니다. 그해 청이 침입해 병자호란이 일어났으며, 인조는 남한산성에서 항전하다가 1637년 삼전도에서 항복하고 청과 군신 관계를 맺었습니다. 실제 항복은 전쟁이 시작된 뒤의 일입니다."}], "results": {"D1-P1-R1": {"title": "명의 기대에 부응하는 원정", "text": "명에 적극적으로 군사를 보내 협력을 강화할 수 있지만, 병력과 군량이 빠져나가 조선의 방어와 복구가 어려워질 수 있다."}, "D1-P1-R2": {"title": "파병과 해명이 충돌하다", "text": "후금에 파병 이유를 설명해 오해를 줄이려 했지만, 실제로 조선군이 출전한 이상 후금의 경계는 남을 수 있다."}, "D1-P1-R3": {"title": "두 통의 편지, 하나의 군대", "text": "명과 후금 모두에 조선의 사정을 알렸지만, 두 나라는 저마다 다른 약속을 요구할 수 있다."}, "D1-P2-R1": {"title": "적은 병력, 커지는 추가 요구", "text": "병력 일부를 조선에 남겨 방어력을 지킬 수 있지만, 명은 지원이 부족하다며 추가 파병을 요구할 수 있다."}, "D1-P2-R2": {"title": "작은 원군도 원군이다", "text": "후금에 제한적인 파병이라고 설명했지만, 후금은 적은 병력도 자신을 겨눈 군대로 받아들일 수 있다."}, "D1-P2-R3": {"title": "작게 보내고 넓게 설득하다", "text": "두 나라에 조선의 어려움을 설명했지만, 명은 병력이 적다고 불만을 품고 후금은 파병 자체를 경계할 수 있다."}, "D1-P3-R1": {"title": "조건을 묻는 조선", "text": "명과 파병 조건을 협의해 군사의 부담을 줄이려 했지만, 명은 협상 때문에 지원이 늦어진다고 여길 수 있다."}, "D1-P3-R2": {"title": "전투의 경계를 설명하다", "text": "후금에 조선군의 활동 범위를 알렸지만, 후금은 제한된 참전조차 위협으로 받아들일 수 있다."}, "D1-P3-R3": {"title": "협상이 세 갈래로 갈리다", "text": "명과 조건을 협의하고 후금에도 뜻을 전했지만, 두 나라의 요구가 부딪혀 조정의 부담이 커질 수 있다."}, "D1-P4-R1": {"title": "국경에서 돕겠다는 제안", "text": "군사를 국경에 남겨 조선 방어에 힘쓸 수 있지만, 명은 원정에 참여하지 않는 지원을 거절할 수 있다."}, "D1-P4-R2": {"title": "방어군의 그림자", "text": "후금에 국경 방어가 목적이라고 설명했지만, 명은 조선이 원군 약속을 지키지 않는다고 생각할 수 있다."}, "D1-P4-R3": {"title": "서신보다 가까운 국경", "text": "두 나라에 방어 계획을 설명했지만, 명은 원정군을 요구하고 후금은 국경의 병력을 의심할 수 있다."}, "D1-P5-R1": {"title": "군사 대신 보급을 보내다", "text": "병사 대신 물자를 보내 전투 참여를 줄일 수 있지만, 식량과 운송에 드는 부담은 조선에 남을 수 있다."}, "D1-P5-R2": {"title": "물자의 행선지가 드러나다", "text": "후금에 군사 파견을 줄이겠다고 알렸지만, 명에 보낸 물자가 전쟁에 쓰이면 후금의 경계는 커질 수 있다."}, "D1-P5-R3": {"title": "병력은 남고 곳간은 비다", "text": "두 나라에 물자 지원 방침을 설명했지만, 명은 병력을 더 요구하고 후금은 물자 지원도 적대 행위로 볼 수 있다."}, "D1-P6-R1": {"title": "시간을 청한 답신", "text": "명에 시간을 요청해 파병 조건을 다시 논의할 수 있지만, 명은 이를 지원을 피하려는 행동으로 여길 수 있다."}, "D1-P6-R2": {"title": "시간이 불신이 되지 않으려면", "text": "후금에 결정을 미룬 이유를 설명했지만, 명은 후금과의 접촉을 의심할 수 있다."}, "D1-P6-R3": {"title": "두 나라의 시계", "text": "두 나라에 시간을 요청해 정세를 더 살피려 했지만, 서로 다른 답변 기한을 요구받을 수 있다."}, "D1-P7-R1": {"title": "거절의 이유를 말하다", "text": "파병을 거절해 조선군을 지킬 수 있지만, 명은 임진왜란 때의 도움을 떠올리며 반발할 수 있다."}, "D1-P7-R2": {"title": "원정을 거절하고 후금에 알리다", "text": "후금에 참전하지 않겠다고 알려 긴장을 낮추려 했지만, 명은 조선이 후금 편에 섰다고 의심할 수 있다."}, "D1-P7-R3": {"title": "거절 뒤의 두 외교 관계", "text": "두 나라에 파병을 거절한 사정을 설명했지만, 명은 지원 거절에 불만을 품고 후금은 조선의 다음 행동을 의심할 수 있다."}, "D2-P1-R1": {"title": "의리를 지키며 방어를 서두르다", "text": "명과의 의리를 지키며 방어를 강화할 수 있지만, 후금군과의 충돌이 길어지면 군량과 인명 피해가 늘어날 수 있다."}, "D2-P1-R2": {"title": "항전하면서 후금의 요구를 묻다", "text": "항전 중에도 후금의 요구를 파악할 수 있지만, 협상이 늦어지면 전쟁의 피해가 커질 수 있다."}, "D2-P1-R3": {"title": "항전과 피난을 동시에", "text": "명과의 약속을 지키면서 피난을 도울 수 있지만, 방어와 주민 보호에 필요한 물자·인력이 부족할 수 있다."}, "D2-P2-R1": {"title": "성을 지키며 협상을 시도하다", "text": "명과의 관계를 지키면서 방어를 바탕으로 후금과 협상을 시도할 수 있지만, 양측의 요구가 어긋나면 충돌이 계속될 수 있다."}, "D2-P2-R2": {"title": "침입을 끝낼 조건을 알아보다", "text": "후금의 요구를 직접 확인해 전쟁을 끝낼 실마리를 찾을 수 있지만, 명과 조정 일부의 불신을 살 수 있다."}, "D2-P2-R3": {"title": "협상을 서두르며 피난을 돕다", "text": "후금과의 교섭과 주민 보호를 함께 추진할 수 있지만, 협상이 결렬되면 방어를 보강할 시간이 부족할 수 있다."}, "D2-P3-R1": {"title": "새 외교 방향과 방비", "text": "후금과의 갈등 완화를 시도하며 방어를 유지할 수 있지만, 명과 국내 신하들의 반발이 커질 수 있다."}, "D2-P3-R2": {"title": "후금에 관계 전환을 제안하다", "text": "후금에 외교 노선 변경을 알려 대화의 길을 열 수 있지만, 후금이 더 큰 양보를 요구하거나 명의 불신을 살 수 있다."}, "D2-P3-R3": {"title": "관계를 바꾸며 사람을 지키다", "text": "후금과의 긴장 완화를 시도하며 피난에 힘쓸 수 있지만, 외교적 양보가 곧바로 침입 중단을 보장하지는 않는다."}, "D3-P1-R1": {"title": "원칙을 지키며 전쟁에 대비하다", "text": "청의 요구를 거부하며 명과의 의리를 지킬 수 있지만, 군사적 충돌이 발생하면 방어와 전쟁 비용을 감당해야 할 수 있다."}, "D3-P1-R2": {"title": "거부의 이유를 전하다", "text": "청에 거부의 이유를 전달해 대화의 여지를 남길 수 있지만, 청이 이를 받아들이지 않으면 전쟁 위험은 여전할 수 있다."}, "D3-P1-R3": {"title": "결사항전과 주민 보호", "text": "명과의 의리를 지키면서 피난을 준비할 수 있지만, 방어에 쓸 시간과 물자가 부족해질 수 있다."}, "D3-P2-R1": {"title": "방비하며 타협을 모색하다", "text": "군사를 대비시키며 청과 타협할 시간을 벌 수 있지만, 청이 양보를 거절하면 전쟁 준비와 협상 모두 어려워질 수 있다."}, "D3-P2-R2": {"title": "마지막 사절을 보내다", "text": "사절을 통해 청의 요구를 다시 확인할 수 있지만, 협상 시간이 길어져도 청의 군사 행동이 멈춘다는 보장은 없다."}, "D3-P2-R3": {"title": "협상하며 피난 준비", "text": "청과 대화하면서 주민의 피난을 준비할 수 있지만, 협상이 실패하면 방어를 보강할 여유가 줄어들 수 있다."}, "D3-P3-R1": {"title": "요구를 받아들이고 경계하다", "text": "청의 요구를 받아들여 전쟁 위험을 낮추려 할 수 있지만, 명과의 관계가 흔들리고 국내 신하들의 반발을 불러올 수 있다."}, "D3-P3-R2": {"title": "굴욕을 감수하며 합의를 서두르다", "text": "청과의 합의를 서둘러 군사 충돌을 피하려 할 수 있지만, 청이 더 많은 의무를 요구하거나 명이 반발할 수 있다."}, "D3-P3-R3": {"title": "굴복 뒤의 삶을 대비하다", "text": "청의 요구를 수용하며 주민의 생활을 지키려 할 수 있지만, 외교적 종속과 새 부담이 오래 이어질 수 있다."}}, "finalQuestions": [{"title": "1. 역사적 상황에 대한 이해", "q": "광해군과 인조가 처한 국제 정세와 국내 상황을 각각 설명하고, 구체적인 역사적 사실을 제시하세요."}, {"title": "2. 선택 요인과 결과의 논리성", "q": "두 왕의 선택에 영향을 준 요인을 설명하고, 상황 → 고려 요인 → 실제 정책 → 실제 결과를 역사적 사실에 근거하여 연결하세요."}, {"title": "3. 다양한 관점에서의 역사적 평가", "q": "세 번의 결정에서 기록한 여섯 집단의 평가를 참고하여, 같은 결정에 대한 두 집단의 평가가 어떻게 다를 수 있는지 구체적으로 설명하세요."}, {"title": "4. 자신의 역사적 판단과 근거", "q": "당시 상황과 두 왕의 선택 이유 및 실제 결과를 종합하여, 광해군 또는 인조의 선택을 평가할 나만의 기준을 밝히고 역사적 근거를 들어 설명하세요."}]};
const SS_KEY='royal-choice-worksheet-mode-v1';
function freshState(){return {mode:'intro',chapterIndex:0,contextIndex:0,decisions:{},usedPerspectives:[]}}
let state=load()||freshState();
function load(){try{return JSON.parse(sessionStorage.getItem(SS_KEY)||'null')}catch(e){return null}}
function save(){sessionStorage.setItem(SS_KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ch(){return STORY.chapters[state.chapterIndex]}
function d(){const id=ch().id;return state.decisions[id]||(state.decisions[id]={policyId:'',responseId:'',perspectives:[],resultId:''})}
function policyLabel(c,id){return c.policies.find(x=>x.id===id)?.title||''}
function responseLabel(c,id){return c.responses.find(x=>x.id===id)?.title||''}
function pLabel(id){return STORY.perspectives[id]?.label||id}
const STAGES=[
 {id:'context',label:'상황'}, {id:'decision',label:'결정'}, {id:'worksheet',label:'학습지'},
 {id:'result',label:'시뮬레이션'}, {id:'perspective',label:'관점'}, {id:'actual',label:'실제 역사'}, {id:'summary',label:'정리'}
];
function stageId(){
 if(state.mode==='intro')return '';
 if(state.mode==='context')return 'context';
 if(['decisionGate','policy','response'].includes(state.mode))return 'decision';
 if(state.mode==='worksheet')return 'worksheet';
 if(state.mode==='result')return 'result';
 if(['perspectives','perspectiveSheet'].includes(state.mode))return 'perspective';
 if(state.mode==='actual')return 'actual';
 return 'summary';
}
function updateStageStrip(){
 const el=document.getElementById('stageStrip');if(!el)return;
 const cur=stageId(),idx=STAGES.findIndex(x=>x.id===cur);
 el.innerHTML=STAGES.map((x,i)=>`<span class="stage-chip ${i<idx?'done':''} ${x.id===cur?'current':''}">${esc(x.label)}</span>`).join('');
 const active=el.querySelector('.current');if(active)requestAnimationFrame(()=>active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}));
}
function decisionBanner(c=ch(),dec=d(),includeResponse=true){
 if(!dec?.policyId)return '';
 const p=policyLabel(c,dec.policyId),r=includeResponse&&dec.responseId?responseLabel(c,dec.responseId):'';
 return `<div class="decision-banner"><div class="decision-kicker">나의 왕명</div><div class="decision-main">${esc(p)}</div>${r?`<div class="decision-sub">추가 대응 · ${esc(r)}</div>`:''}</div>`;
}

function reEsc(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

 if(!ks.length)return esc(text);
 const re=new RegExp('('+ks.map(reEsc).join('|')+')','g'),set=new Set(ks);

}

 <div class="instruction-box"><strong>최종 평가는 학습지에 작성합니다.</strong> 아래 기록을 보며 자신의 선택과 결과를 다시 확인하세요.</div>
 <section class="summary">${STORY.chapters.map(c=>{const dec=state.decisions[c.id],r=STORY.results[dec.resultId];return `<div class="summary-item"><b>${esc(c.year)} · ${esc(c.title)}</b>
 <div><span class="gold">${esc(policyLabel(c,dec.policyId))}</span> + ${esc(responseLabel(c,dec.responseId))}</div>
 <div class="summary-perspectives">${dec.perspectives.map(id=>`<span>${esc(pLabel(id))}</span>`).join('')}</div>
 <div class="summary-title">${esc(r?.title||'가상 결과')}</div>
 <div class="summary-result">${esc(r?.text||'')}</div></div>`}).join('')}</section>
 <section class="card" style="margin-top:12px"><div class="notice">학습지의 최종 역사적 평가 문항까지 작성하면 수행평가가 끝납니다.</div></section>`);
 setActions([{text:'이전',cls:'ghost',onclick:'backLastActual()'},{text:'다른 선택의 결과 살펴보기',cls:'primary',onclick:'openExplorer()'}])
}
function backLastActual(){state.chapterIndex=STORY.chapters.length-1;state.mode='actual';save();render()}
function openExplorer(){state.mode='explorer';save();render()}
function renderExplorer(){
 setMain(`<section class="hero"><div class="eyebrow">선택 결과 탐색실</div><h1>다른 선택을 했다면?</h1><p>이 화면은 추가 탐색용입니다. 학습지에 기록한 자신의 선택은 바뀌지 않습니다.</p></section>
 <section class="card"><div class="explorer-controls">
 <select id="exChapter" onchange="refreshExplorerOptions()">${STORY.chapters.map((c,i)=>`<option value="${i}">${esc(c.year)} · ${esc(c.title)}</option>`).join('')}</select>
 <select id="exPolicy"></select><select id="exResponse"></select>
 </div><div class="explorer-result" id="exResult"></div></section>`);
 setActions([{text:'이전',cls:'ghost',onclick:'backSummary()'}]);
 refreshExplorerOptions()
}
function refreshExplorerOptions(){
 const ci=+document.getElementById('exChapter').value,c=STORY.chapters[ci];
 const ps=document.getElementById('exPolicy'),rs=document.getElementById('exResponse');
 ps.innerHTML=c.policies.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');
 rs.innerHTML=c.responses.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');
 ps.onchange=showExplorerResult;rs.onchange=showExplorerResult;showExplorerResult()
}
function showExplorerResult(){
 const ci=+document.getElementById('exChapter').value,c=STORY.chapters[ci],p=document.getElementById('exPolicy').value,r=document.getElementById('exResponse').value;
 const x=STORY.results[`${c.id}-${p}-${r}`];
 document.getElementById('exResult').innerHTML=`<div class="badge">가상 가능성</div><div>${esc(x?.text||'결과 없음')}</div>`
}
function backSummary(){state.mode='summary';save();render()}
function restart(){if(confirm('진행을 처음부터 다시 시작할까요?')){sessionStorage.removeItem(SS_KEY);state=freshState();render()}}
render();
</script>
</body>
</html>
